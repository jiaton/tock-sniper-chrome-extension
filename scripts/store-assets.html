<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; background: #f7f8fb; }
    body { overflow: hidden; }
    .stage { width: 1280px; height: 800px; position: relative; background:
      linear-gradient(135deg, rgba(37,99,235,.12), transparent 34%),
      linear-gradient(225deg, rgba(22,163,74,.13), transparent 36%),
      #f7f8fb; }
    .browser { position: absolute; inset: 44px 54px; border: 1px solid #d7dce7; border-radius: 8px; background: #fff; box-shadow: 0 24px 80px rgba(15,23,42,.16); overflow: hidden; }
    .topbar { height: 58px; background: #f2f4f8; border-bottom: 1px solid #d7dce7; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
    .dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; }
    .dot:nth-child(1) { background: #ef4444; } .dot:nth-child(2) { background: #f59e0b; } .dot:nth-child(3) { background: #22c55e; }
    .addr { flex: 1; height: 34px; border-radius: 5px; background: #fff; border: 1px solid #d6dbe5; display: flex; align-items: center; padding: 0 14px; color: #64748b; font-size: 16px; }
    .page { height: calc(100% - 58px); display: grid; grid-template-columns: 1fr 390px; background: #fbfbfd; }
    .venue { position: relative; padding: 56px 62px; background: linear-gradient(180deg, #ffffff, #f7f9fd); }
    .brand { display: flex; align-items: center; gap: 14px; font-weight: 760; font-size: 26px; margin-bottom: 44px; }
    .mark { width: 46px; height: 46px; border-radius: 8px; background: #111827; display: grid; place-items: center; color: white; font-weight: 800; }
    h1 { margin: 0; max-width: 610px; font-size: 58px; line-height: 1.02; letter-spacing: 0; }
    .sub { margin-top: 18px; max-width: 560px; font-size: 21px; line-height: 1.45; color: #475569; }
    .hero-row { display: flex; gap: 14px; margin-top: 38px; }
    .pill { border: 1px solid #dbe2ee; background: white; border-radius: 6px; padding: 12px 16px; font-size: 15px; color: #334155; }
    .book { position: absolute; left: 62px; bottom: 70px; background: #111827; color: #fff; border: 0; border-radius: 6px; font-size: 18px; font-weight: 760; padding: 17px 28px; }
    .popup { margin: 44px 42px 0 0; width: 340px; background: #fff; border: 1px solid #d7dce7; border-radius: 8px; box-shadow: 0 22px 58px rgba(15,23,42,.18); padding: 14px; align-self: start; }
    .popup h2 { margin: 0 0 4px; font-size: 17px; }
    .desc { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    label { display: block; font-weight: 700; margin-top: 9px; font-size: 12px; color: #475569; }
    .input { margin-top: 3px; height: 32px; border: 1px solid #cfd6e3; border-radius: 5px; background: #fff; padding: 6px 9px; font-size: 13px; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .small { margin-top: 2px; color: #64748b; font-size: 11px; }
    .slot { margin-top: 10px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 6px; padding: 8px; }
    .slot-title { font-size: 12px; font-weight: 760; margin-bottom: 6px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .add { margin-top: 9px; height: 30px; border-radius: 5px; border: 1px dashed #b8c0cf; background: #f8fafc; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #334155; }
    .arm { margin-top: 11px; height: 42px; border-radius: 6px; background: #2563eb; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
    .callout { position: absolute; left: 84px; top: 86px; color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 7px; padding: 14px 18px; font-size: 18px; font-weight: 760; box-shadow: 0 10px 28px rgba(37,99,235,.12); }
    .overlay { position: absolute; right: 54px; bottom: 44px; width: 360px; border-radius: 8px; background: #111827; color: #fff; padding: 20px 22px; box-shadow: 0 22px 70px rgba(15,23,42,.35); }
    .overlay .title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
    .overlay .count { font-size: 44px; font-weight: 850; line-height: 1; margin: 10px 0; color: #93c5fd; }
    .steps { display: grid; gap: 10px; margin-top: 16px; }
    .step { display: flex; align-items: center; gap: 10px; color: #dbeafe; font-size: 15px; }
    .check { width: 22px; height: 22px; border-radius: 50%; background: #22c55e; display: grid; place-items: center; color: white; font-weight: 800; font-size: 14px; }
    .dialog { position: absolute; inset: 105px 250px 70px 250px; background: #fff; border: 1px solid #d9deea; border-radius: 8px; box-shadow: 0 28px 90px rgba(15,23,42,.25); padding: 28px; }
    .month { display: flex; justify-content: space-between; align-items: center; font-size: 25px; font-weight: 820; margin-bottom: 22px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day, .dow { height: 52px; display: grid; place-items: center; border-radius: 6px; font-weight: 720; }
    .dow { color: #64748b; height: 28px; font-size: 13px; }
    .day { background: #f8fafc; border: 1px solid #e2e8f0; color: #334155; font-size: 17px; }
    .day.target { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 12px 26px rgba(37,99,235,.28); }
    .slots { position: absolute; right: 78px; top: 128px; width: 330px; display: grid; gap: 14px; }
    .time { border: 1px solid #dbe2ee; background: #fff; border-radius: 7px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 12px 35px rgba(15,23,42,.08); }
    .time b { font-size: 21px; }
    .time span { display: block; color: #64748b; font-size: 13px; margin-top: 3px; }
    .time button { background: #111827; color: #fff; border: 0; border-radius: 5px; padding: 10px 16px; font-weight: 800; }
    .time.pick { border-color: #2563eb; box-shadow: 0 16px 42px rgba(37,99,235,.2); }
    .tabs { position: absolute; left: 118px; top: 130px; right: 118px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .tab { background: #fff; border: 1px solid #dbe2ee; border-radius: 8px; box-shadow: 0 14px 45px rgba(15,23,42,.1); padding: 20px; min-height: 130px; }
    .tab h3 { margin: 0 0 12px; font-size: 20px; }
    .status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; padding: 8px 11px; font-size: 14px; font-weight: 760; }
    .status.done { background: #f0fdf4; color: #166534; }
    .checkout { position: absolute; left: 118px; right: 118px; bottom: 88px; height: 260px; display: grid; grid-template-columns: 1.1fr .9fr; background: #fff; border: 1px solid #dbe2ee; border-radius: 8px; overflow: hidden; box-shadow: 0 18px 60px rgba(15,23,42,.12); }
    .checkout > div { padding: 30px; }
    .summary { background: #f8fafc; border-left: 1px solid #e2e8f0; }
    .line { height: 16px; background: #e2e8f0; border-radius: 4px; margin: 16px 0; }
    .line.short { width: 62%; }
    .headline { position: absolute; left: 92px; top: 86px; font-size: 48px; line-height: 1.06; font-weight: 850; max-width: 680px; }
    .caption { position: absolute; left: 94px; top: 200px; max-width: 590px; font-size: 21px; line-height: 1.4; color: #475569; }
    .iconbody { width: 100vw; height: 100vh; display: grid; place-items: center; background: transparent; }
    .appicon { width: 75%; height: 75%; border-radius: 22%; background: linear-gradient(135deg, #2563eb, #16a34a); position: relative; box-shadow: inset 0 -10px 20px rgba(15,23,42,.16); }
    .appicon:before { content: ""; position: absolute; inset: 20%; border: .12em solid #fff; border-radius: 50%; }
    .appicon:after { content: ""; position: absolute; left: 50%; top: 12%; width: .12em; height: 76%; background: #fff; transform: translateX(-50%); box-shadow: 0.28em 0.28em 0 -.02em #fff, -0.28em 0.28em 0 -.02em #fff; }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const scene = params.get("scene") || "1";
    if (scene === "icon") {
      document.body.innerHTML = '<div class="iconbody"><div class="appicon"></div></div>';
    } else {
      const popup = `<aside class="popup">
        <h2>Tock Sniper</h2><div class="desc">Auto-grab Tock reservations the instant they drop.</div>
        <label>Restaurant URL</label><div class="input">https://www.exploretock.com/atelier-demo</div>
        <label>Party Size</label><div class="input">2</div>
        <label>Release Time</label><div class="input">2026-06-05 10:00:00</div><div class="small">Auto-refreshes 500ms before this time.</div>
        <label>Preferred Times</label><div class="input">7:00 PM, 8:00 PM</div><div class="small">Tries in order. Fallback = latest available.</div>
        <div class="slot"><div class="slot-title">Target Date 1</div><div class="row"><div><label>Date</label><div class="input">2026-06-12</div></div><div><label>Note</label><div class="input">Friday</div></div></div></div>
        <div class="add">+ Add Date</div><div class="arm">Arm Sniper (opens 3 tabs)</div>
      </aside>`;
      document.body.innerHTML = `<main class="stage"><div class="browser"><div class="topbar"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="addr">exploretock.com/atelier-demo</div></div><div class="page"><section class="venue"><div class="brand"><div class="mark">T</div><div>Atelier Demo</div></div><h1>Reservations that vanish fast.</h1><div class="sub">Tock Sniper prepares every target date and launches each booking tab exactly when reservations open.</div><div class="hero-row"><div class="pill">June 12</div><div class="pill">Party of 2</div><div class="pill">7:00 PM preferred</div></div><button class="book">Book now</button></section>${popup}</div></div></main>`;
      if (scene === "2") document.querySelector(".stage").insertAdjacentHTML("beforeend", '<div class="callout">One tab per target date</div><div class="tabs"><div class="tab"><h3>June 12</h3><div class="status">Target waiting</div></div><div class="tab"><h3>June 13</h3><div class="status">Target waiting</div></div><div class="tab"><h3>June 14</h3><div class="status">Target waiting</div></div></div>');
      if (scene === "3") document.querySelector(".stage").insertAdjacentHTML("beforeend", '<div class="overlay"><div class="title">Release countdown</div><div class="count">00:00:04</div><div>Reload queued just before release time.</div><div class="steps"><div class="step"><span class="check">✓</span> Configuration loaded</div><div class="step"><span class="check">✓</span> Waiting for reservation drop</div><div class="step"><span class="check">✓</span> Auto-reload armed</div></div></div>');
      if (scene === "4") document.querySelector(".stage").innerHTML = '<div class="browser"><div class="topbar"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="addr">exploretock.com/atelier-demo/experience</div></div><div class="page" style="display:block;background:#fbfbfd"></div></div><div class="headline">Auto-selects the right date.</div><div class="caption">The content script opens booking, navigates months when needed, and clicks the requested calendar date.</div><div class="dialog" style="left:520px;right:78px;top:126px;bottom:72px;inset:auto 78px 72px 520px"><div class="month"><span>June 2026</span><span>→</span></div><div class="grid"><div class="dow">SUN</div><div class="dow">MON</div><div class="dow">TUE</div><div class="dow">WED</div><div class="dow">THU</div><div class="dow">FRI</div><div class="dow">SAT</div>' + Array.from({length: 35}, (_, i) => `<div class="day ${i===12?'target':''}">${i+1<=30?i+1:''}</div>`).join("") + '</div></div>';
      if (scene === "5") document.querySelector(".stage").innerHTML = '<div class="browser"><div class="topbar"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="addr">exploretock.com/atelier-demo/checkout</div></div><div class="page" style="display:block;background:#fbfbfd"></div></div><div class="headline">Picks the best slot and stops at checkout.</div><div class="caption">Preferred times are tried first, with a fallback to the latest available time if they are gone.</div><div class="slots"><div class="time"><div><b>6:30 PM</b><span>Dining room</span></div><button>Book</button></div><div class="time pick"><div><b>7:00 PM</b><span>Preferred match</span></div><button>Book</button></div><div class="time"><div><b>8:15 PM</b><span>Patio</span></div><button>Book</button></div></div><div class="checkout"><div><h2>Checkout reached</h2><div class="line"></div><div class="line short"></div><div class="line"></div></div><div class="summary"><h2>Reservation</h2><div class="line"></div><div class="line short"></div><div class="status done">Ready for payment</div></div></div>';
    }
  </script>
</body>
</html>
