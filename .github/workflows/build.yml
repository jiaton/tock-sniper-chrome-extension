name: Build Extension ZIP

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          # Major.Minor from manifest, patch = commit count
          BASE=$(jq -r .version manifest.json | cut -d. -f1,2)
          PATCH=$(git rev-list --count HEAD)
          VERSION="${BASE}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build ZIP
        run: |
          zip -r tock-sniper-ext.zip \
            manifest.json \
            content.js \
            popup.js \
            popup.html \
            background.js \
            icons/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tock-sniper-ext-${{ steps.version.outputs.version }}
          path: tock-sniper-ext.zip

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release"
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" tock-sniper-ext.zip \
              --title "Tock Sniper $TAG" \
              --generate-notes
          fi
